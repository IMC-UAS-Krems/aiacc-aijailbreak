name: Robin Hoodie CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: robin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Test Flask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBIN_TEST_BACKEND_COMMAND: '["python", "-m", "backend", "--port", "{port}"]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/backend -v

  frontend:
    name: Test and build React
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    name: Check and publish game image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Build the release
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
      - name: Start the image and check the frontend and API
        run: |
          docker run -d --name robin-ci -p 127.0.0.1:18080:8000 "$IMAGE"
          trap 'docker logs robin-ci; docker rm -f robin-ci' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/ -o /tmp/robin.html
          grep -q 'id="root"' /tmp/robin.html
          curl -fsS http://127.0.0.1:18080/api/levels -o /tmp/robin-levels.json
          jq -e '.levels | any(.id == 5 and .implemented == true)' /tmp/robin-levels.json
      - name: Publish the checked image
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          repo_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$repo_digest" == "${IMAGE%:*}@sha256:"* ]]
          docker tag "$IMAGE" "${IMAGE%:*}:demo"
          docker push "${IMAGE%:*}:demo"
          echo "Published \`$repo_digest\` for \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
